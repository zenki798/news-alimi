# 뉴스를 모아 사이트에 올린다. 한 번 돌 때마다 약 5분 뒤의 다음 차례를 스스로 부른다.
# (2026-10-01 속보를 빨리 띄우려고 15분 → 5분으로 줄였다. 화면은 보이는 동안만 "바뀌었나"를 묻는다 — app.js)
#
# 왜 이 방식인가
# - 브라우저에서 RSS 를 직접 받으면 CORS 에 막힌다. 수집은 서버 측(Actions 러너)에서 한다.
# - public 저장소의 Actions 는 무료다. 외부 라이브러리가 없어서 npm install 단계도 없다.
#
# 왜 예약(schedule)이 아니라 "다음 차례 부르기"인가 (AGENTS.md 4항)
# - GitHub 는 예약 실행을 보장하지 않는다. '*/30' 은 이틀간 9번(4~8시간 간격)만 돌았고,
#   혼잡을 피해 7·22·37·52분으로 옮긴 뒤에도 첫 1시간 동안 한 번도 돌지 않았다 (2026-09-30).
# - 수동 실행(workflow_dispatch)은 바로 돈다. 그래서 끝날 때마다 다음 차례를 부르고, 다음 차례는
#   저장소 설정의 환경 news-interval 에 둔 대기 타이머(wait timer, 4분)만큼 기다린 뒤 수집한다.
#   기다리는 동안에는 러너를 쓰지 않는다.
# - 예약은 사슬이 끊겼을 때 다시 잇는 예비용으로만 남긴다.
#
# 쌓이는 것을 줄인다
# - git 은 지난 커밋을 지울 수 없다(이력을 고쳐 써야 한다). 그래서 애초에 적게 넣는다.
#   사이트에는 방금 모은 뉴스를 배포 산출물로만 올리고, 저장소 사본(data/news.js)은 하루 한 번만 커밋한다.
#   (5분마다 커밋하면 한 해 약 840MB, 하루 한 번이면 약 3MB)
# - 5분마다 생기는 배포 산출물은 1일 뒤 자동 삭제되고, 실행 기록·배포 기록은 한 시간에 한 번 7일 지난 것을 지운다.
#   하루 한 번 몰아서 지우면 약 1,500번을 한꺼번에 요청해 GitHub API 한도(시간당 1,000회)를 넘는다.
#
# 스스로 낫기 (2026-10-06, AGENTS.md 6항)
# - 2026-10-05 배포 작업이 GitHub 서버를 배정받지 못해 대기열에 7시간 멈췄고, 사슬과 예비 예약이 모두 그 뒤에 섰다.
# - 수집기는 성공할 때마다 data/status.json(heartbeat)을 사이트에 함께 올린다.
# - 따로 도는 수집 지킴이(watchdog.yml)가 heartbeat 가 15분 넘게 멈추면 멈춘 차례를 취소하거나 다시 실행하거나
#   새로 부른다(1시간에 3번까지). 지킴이가 부른 차례는 이름에 "(자동 복구)"가 붙는다.
# - 이 워크플로는 차례마다 지킴이가 살아 있는지 보고, 끊겼으면 다시 부른다(서로 지켜본다).
name: 뉴스 수집·배포
run-name: ${{ github.event.inputs.reason == 'watchdog' && '뉴스 수집·배포 (자동 복구)' || '뉴스 수집·배포' }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      chain:
        description: '앞 차례가 부른 실행인가 (직접 누를 때는 끈 채로 둔다)'
        type: boolean
        default: false
      reason:
        description: '누가 불렀나 (수집 지킴이는 watchdog)'
        type: string
        default: ''
  schedule:
    # 예비용 — 사슬이 끊겼을 때 다시 잇는다. 정시·5분 단위는 예약이 몰리는 시각이라 피한다.
    - cron: '7,37 * * * *'

permissions:
  contents: write     # 저장소 사본 커밋
  pages: write        # 사이트 배포
  id-token: write     # 사이트 배포
  actions: write      # 다음 차례 부르기, 지난 실행 기록 지우기
  deployments: write  # 지난 배포 기록 지우기

# 한 번에 하나만 돈다. 대기 중인 실행은 하나만 남고 나머지는 취소되므로,
# 푸시·예약·수동 실행이 끼어들어도 사슬이 여러 갈래로 늘지 않고 하나로 합쳐진다.
concurrency:
  group: news
  cancel-in-progress: false

jobs:
  wait:
    # 앞 차례가 부른 실행만 기다린다. 대기 시간은 환경 news-interval 의 wait timer(4분)에 있다.
    if: github.event_name == 'workflow_dispatch' && inputs.chain
    runs-on: ubuntu-latest
    environment: news-interval
    steps:
      - name: 실제로 기다렸는지 확인
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
          waited=$(( $(date +%s) - $(date -d "$created" +%s) ))
          echo "기다린 시간: $((waited / 60))분 $((waited % 60))초"
          # 환경의 타이머가 사라지면 기다리지 않고 곧바로 다음 차례를 불러 끝없이 돈다. 여기서 사슬을 끊는다.
          # 타이머는 4분(240초)이다. 3분 미만이면 타이머가 없거나 줄어든 것으로 본다.
          if [ "$waited" -lt 180 ]; then
            echo "::error::환경 news-interval 에 대기 타이머가 없다. 사슬을 멈춘다 (AGENTS.md 4항)."
            exit 1
          fi

  build:
    needs: wait
    # 기다리기를 건너뛴 실행(푸시·수동·예약)도 수집한다. 대기 확인이 실패했으면 하지 않는다.
    if: ${{ !cancelled() && needs.wait.result != 'failure' }}
    runs-on: ubuntu-latest
    # 피드마다 시간 제한(15초×최대 3번)이 있어 수집은 1분 안쪽이다. 어딘가에서 걸려도 차례가 끝없이 붙들리지 않게 한다.
    timeout-minutes: 10
    outputs:
      daily: ${{ steps.daily.outputs.daily }}
      hourly: ${{ steps.daily.outputs.hourly }}
    steps:
      # 기다리는 사이 올라온 커밋까지 배포하도록 main 최신본을 받는다. 하루 판단에 이력이 필요하다.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: RSS 수집
        id: collect
        # 출처가 모두 실패한 칸은 지금 사이트에 올라가 있는 지난 데이터로 채운다(6시간 안의 것만)
        env:
          NEWS_PREVIOUS_URL: https://zenki798.github.io/news-alimi/data/news.js
        run: node scripts/fetch-news.js

      - uses: actions/configure-pages@v5

      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site/icons _site/data
          cp index.html app.js manifest.webmanifest sw.js _site/
          cp icons/*.png _site/icons/
          cp data/mock-news.js data/news.js _site/data/
          # 수집 성공 기록(heartbeat). 지킴이가 사이트에서 읽어 "마지막 성공"을 본다 — 배포까지 끝나야 갱신된다
          cp data/status.json _site/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

      - name: 하루 한 번·한 시간에 한 번 할 일인가
        id: daily
        env:
          FAILED: ${{ steps.collect.outputs.failed }}
        run: |
          last=$(git log -1 --format=%ct -- data/news.js)
          age=$(( $(date +%s) - ${last:-0} ))
          echo "저장소 사본은 $((age / 3600))시간 $((age % 3600 / 60))분 전에 커밋했다. 이번 차례 피드 실패: ${FAILED:-?}개"
          # 저장소 사본은 하루 한 번, 피드 실패가 없는 차례에 커밋한다. 실패한 순간의 사본이 남으면 그 칸이 비거나
          # 한 출처만 남아 저장소의 테스트가 실패한다. 이틀 넘게 실패가 이어지면 그래도 커밋한다(저장소 활동이 끊기지 않게).
          ok=$([ "${FAILED:-1}" = "0" ] || [ "$age" -ge 172800 ] && echo 1 || echo 0)
          echo "daily=$([ "$age" -ge 86400 ] && [ "$ok" = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # 약 5분마다 도므로 매시 0~4분에 시작한 차례가 대개 한 시간에 한 번이다.
          # 어느 시간에 건너뛰거나 두 번 돌아도 괜찮다 — 다음 차례가 남은 것을 지우고, 두 번째는 지울 게 거의 없다.
          echo "hourly=$([ "$((10#$(date -u +%M)))" -lt 5 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: 저장소 사본 커밋 (하루 한 번)
        if: steps.daily.outputs.daily == 'true'
        # 실패해도 사이트 배포는 한다. 다음 차례에 다시 시도한다.
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          COUNT=$(grep -o '"id":' data/news.js | wc -l)
          git add data/news.js
          git commit -m "뉴스 갱신: ${COUNT}건 ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          # 그 사이 사람이 푸시했을 수 있으므로 rebase 후 푸시한다
          git pull --rebase --autostash origin main
          git push origin HEAD:main

  deploy:
    needs: build
    # 조건을 직접 적는다. 안 적으면 GitHub 가 success() 를 붙이는데, success() 는 앞선 작업 전부를 봐서
    # wait 를 건너뛴 실행(푸시·수동·예약)에서는 배포까지 건너뛴다 (2026-09-30 첫 적용 때 겪음).
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    # 돌기 시작한 뒤 걸리면 끊는다. 서버를 배정받지 못해 대기열에서 멈춘 경우(2026-10-05)는 이것으로 못 끊어서
    # 수집 지킴이(watchdog.yml)가 찾아 취소한다.
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  next:
    # 수집·배포가 실패해도 다음 차례는 부른다(한 번 실패로 사슬이 끊기지 않게).
    # 사람이 실행을 취소하면 부르지 않는다 — 사슬을 멈추는 방법이다.
    needs: [wait, build, deploy]
    if: ${{ !cancelled() && needs.wait.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: 다음 차례 부르기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3; do
            gh workflow run fetch-news.yml --repo "${GITHUB_REPOSITORY}" --ref main -f chain=true && exit 0
            sleep 15
          done
          echo "::error::다음 차례를 부르지 못했다. 수집 지킴이가 15분 안에 찾아 다시 잇는다."
          exit 1

      - name: 수집 지킴이가 살아 있는지 확인 (끊겼으면 다시 부른다)
        # 지킴이 사슬이 끊기면 이쪽이 되살리고, 이쪽 사슬이 끊기면 지킴이가 되살린다. 둘 다 끊기면 예비 예약이 잇는다.
        # 지킴이 사슬은 다음 차례를 끝나기 전에 부르므로, 살아 있으면 끝나지 않은 차례가 늘 하나 이상 있다.
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/watchdog.yml/runs?per_page=10" \
                --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          echo "끝나지 않은 지킴이 차례: ${n}개"
          if [ "$n" = "0" ]; then
            echo "::warning::수집 지킴이 사슬이 끊겨 있다. 다시 부른다."
            gh workflow run watchdog.yml --repo "${GITHUB_REPOSITORY}" --ref main -f chain=false
          fi

  cleanup:
    # 한 시간에 한 번 7일 지난 실행 기록과 배포 기록을 지운다. 한 번에 약 100번 요청한다
    # (5분마다면 한 시간에 실행 약 12건·배포 기록 약 24건이 쌓이고, 배포 기록은 목록을 다 훑어야 한다).
    # 하루 한 번으로 두면 한꺼번에 약 1,500번이라 GitHub API 한도(시간당 1,000회)를 넘어 일부가 남는다.
    # 실패해도 수집·배포·다음 차례에는 영향이 없다.
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build.outputs.hourly == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
    steps:
      - name: 7일 지난 실행 기록 지우기
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          # 수집과 수집 지킴이(약 10분마다) 둘 다
          for wf in fetch-news.yml watchdog.yml; do
            ids=$(gh api -X GET --paginate "repos/$R/actions/workflows/$wf/runs" \
                    -f created="<$cutoff" -f per_page=100 --jq '.workflow_runs[].id')
            echo "$wf 지울 실행 기록: $(printf '%s\n' $ids | grep -c . || true)건 ($cutoff 이전)"
            for id in $ids; do gh api -X DELETE "repos/$R/actions/runs/$id" --silent || true; done
          done

      - name: 7일 지난 배포 기록 지우기
        run: |
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          for env in news-interval watchdog-interval github-pages; do
            ids=$(gh api --paginate "repos/$R/deployments?environment=$env&per_page=100" \
                    --jq ".[] | select(.created_at < \"$cutoff\") | .id")
            echo "$env: 지울 배포 기록 $(printf '%s\n' $ids | grep -c . || true)건"
            for id in $ids; do
              # 배포 기록은 비활성으로 돌린 뒤에야 지울 수 있다. 7일 지난 것만 건드리므로 지금 사이트와는 상관없다.
              gh api -X POST "repos/$R/deployments/$id/statuses" -f state=inactive --silent || true
              gh api -X DELETE "repos/$R/deployments/$id" --silent || true
            done
          done
