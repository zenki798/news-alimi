# GitHub Pages 배포.
# 정적 파일만 올리므로 빌드 과정이 없다. 저장소를 그대로 서빙한다.
name: Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 수집 워크플로가 올린 커밋(GITHUB_TOKEN)은 push 이벤트를 일으키지 않는다.
  # 그래서 수집이 끝날 때마다 여기서 이어받아 배포한다. 이게 없으면 사이트의 뉴스가 멈춘다.
  workflow_run:
    workflows: ['뉴스 수집']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 항상 최신 것만 살린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # 수집이 실패했으면 배포할 새 내용이 없다
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # workflow_run 으로 불렸을 때도 수집 커밋이 들어간 main 최신본을 받는다
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - name: 배포할 파일 모으기
        run: |
          mkdir -p _site
          cp index.html app.js manifest.webmanifest sw.js _site/
          mkdir -p _site/icons
          cp icons/*.png _site/icons/
          mkdir -p _site/data
          cp data/mock-news.js _site/data/
          # 수집 결과가 아직 없을 수도 있다. 그때는 목업으로 뜬다.
          if [ -f data/news.js ]; then cp data/news.js _site/data/; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
