<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>뉴스알리미 — 한눈에 보는 뉴스 요약</title>
<meta name="description" content="여러 분야의 뉴스를 한 화면에서 훑어봅니다. 자동으로 수집해 갱신합니다.">
<!-- 홈 화면에 추가하면 주소창·툴바 없이 앱처럼 뜬다 (AGENTS.md 5항 "앱(PWA)으로 설치") -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1319">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="뉴스알리미">
<!-- 어두운 화면이라 아이폰 상태 표시줄도 화면 색 위에 겹쳐 띄운다. 가려지는 만큼은 safe-area 여백으로 비킨다 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0f1319; --card:#1a222e; --line:#2a3542;
    --tx:#e8eef6; --dim:#8b9bb0; --accent:#5b9cff;
  }
  *{box-sizing:border-box}
  /* display 를 지정한 요소는 hidden 속성이 무력화된다. 여기서 못 박아둔다. */
  [hidden]{display:none !important}
  body{
    margin:0; color:var(--tx); background:var(--bg);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    font-size:15px; line-height:1.6;
  }
  /* 노치·홈 표시줄이 있는 기기에서 내용이 가려지지 않게 안전 영역만큼 띄운다 */
  .wrap{
    max-width:1260px; margin:0 auto;
    padding:calc(26px + env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
            calc(26px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }

  /* 앱(홈 화면)으로 실행 중일 때: 웹페이지 티가 나는 동작을 줄인다 */
  html.app-mode{-webkit-tap-highlight-color:transparent}
  html.app-mode body{overscroll-behavior-y:none}
  html.app-mode button, html.app-mode .chip, html.app-mode select{-webkit-user-select:none; user-select:none}
  /* 앱에는 브라우저 새로고침 버튼이 없다. 그 자리를 대신한다 (브라우저로 볼 때는 숨김) */
  html:not(.app-mode) #btnRefresh{display:none}
  #btnRefresh[aria-busy="true"]{opacity:.6; cursor:progress}

  .install{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:rgba(91,156,255,.10); border:1px solid rgba(91,156,255,.35);
    border-radius:10px; padding:10px 14px; font-size:13.5px; margin-bottom:14px;
  }
  .install span{flex:1; min-width:180px}
  .install button{font-size:13px; padding:6px 12px}
  #install-btn{background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:700}
  #install-close{background:none; border-color:transparent; color:var(--dim)}

  /* ---- 헤더 ---- */
  header.top{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; margin-bottom:16px}
  h1{margin:0; font-size:25px; letter-spacing:-.02em; font-weight:800; display:flex; align-items:center; gap:9px}
  h1 .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent)}
  .today{color:var(--dim); font-size:13.5px}
  .upd{color:#2fbf71; background:rgba(47,191,113,.12); border-radius:5px; padding:1px 7px; font-size:12px; margin-left:4px}
  .stats{margin-left:auto; display:flex; gap:15px; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums}
  .stats b{color:var(--tx); font-weight:700}

  #mockBanner{
    background:rgba(247,183,49,.10); border:1px solid rgba(247,183,49,.35);
    color:#f7d78a; border-radius:10px; padding:11px 14px; font-size:13px; margin-bottom:14px;
  }

  /* ---- 조작 영역 ---- */
  .controls{display:flex; gap:9px; flex-wrap:wrap; align-items:center; margin-bottom:13px}
  input[type=search], select, button{
    font:inherit; color:var(--tx); background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:8px 12px;
  }
  input[type=search]{flex:1 1 240px; min-width:0}
  input[type=search]::placeholder{color:var(--dim)}
  input:focus, select:focus, button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  button{cursor:pointer; white-space:nowrap}
  button:hover{border-color:#3b4757}
  button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#06121f; font-weight:700}

  /* 보기 방식 선택 */
  #views{display:inline-flex; background:var(--card); border:1px solid var(--line); border-radius:9px; overflow:hidden}
  #views button{border:0; border-radius:0; background:transparent; padding:8px 13px; font-size:13.5px}
  #views button + button{border-left:1px solid var(--line)}
  /* 위의 transparent 가 눌림 배경을 덮으면 어두운 글자가 어두운 바탕에 묻힌다 */
  #views button[aria-pressed="true"]{background:var(--accent)}
  .perCat{display:inline-flex; align-items:center; gap:7px; font-size:13px; color:var(--dim)}
  .perCat select{padding:7px 9px}

  /* ---- 카테고리 칩 ---- */
  #chips{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:16px}
  .chip{
    display:inline-flex; align-items:center; gap:7px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:999px;
    padding:6px 13px; font-size:13.5px; color:var(--tx);
  }
  .chip .n{font-size:11.5px; color:var(--dim); background:rgba(255,255,255,.07); border-radius:999px; padding:1px 7px; font-variant-numeric:tabular-nums}
  .chip[aria-pressed="true"]{border-color:var(--c); background:color-mix(in srgb, var(--c) 16%, var(--card)); color:#fff}
  .chip[aria-pressed="true"] .n{background:var(--c); color:#0b1017; font-weight:700}

  /* ---- 대시보드 보기 ----
     맨 위에서 눈을 끄는 빨간 상자는 주요 속보 띠 하나뿐이다. 예전의 "주요" 칸은 띠와 시선을 나눠 가져서 없앴다.
     끝없이 도는 애니메이션(animation: … infinite)은 쓰지 않는다. 화면을 계속 다시 그려 휴대폰 배터리를 쓴다. */
  .dash{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px; align-items:start}
  .col{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:13px 14px}
  .col header{display:flex; align-items:center; gap:8px; margin-bottom:9px; padding-bottom:8px; border-bottom:1px solid var(--line)}
  .col h3{margin:0; font-size:13.5px; font-weight:800; color:var(--c); letter-spacing:.01em}
  .col header .n{margin-left:auto; font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums}
  .col ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px}
  .col li{display:flex; flex-direction:column; gap:2px}
  .col li.read{opacity:.42}
  .col li a{color:var(--tx); text-decoration:none; font-size:13.5px; line-height:1.45; font-weight:500}
  .col li a:hover{color:var(--accent)}
  .col li time{font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums}
  .col .none{margin:0; font-size:12.5px; color:var(--dim)}
  .col .note{margin:-3px 0 9px; font-size:11px; line-height:1.45; color:var(--dim)}
  /* 한 줄을 통째로 쓰는 띠 (주요 속보). 안의 목록도 칸 폭으로 나눠 가로로 흐른다.
     auto-fit: 칼럼당 4건이면 4칸이 폭을 나눠 쓴다 (auto-fill 이면 다섯째 칸이 비어 보인다) */
  .col.wide{grid-column:1 / -1; border-color:color-mix(in srgb, var(--c) 45%, var(--line))}
  .col.wide ol{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:8px 18px}
  /* 띠의 긴 제목은 두 줄까지만. 한 건이 길어지면 띠 전체가 높아져 아래 분야 칸을 밀어낸다 */
  .col.wide li a{display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2; overflow:hidden}
  /* 맨 위 한 줄: 주요 속보(3)와 많이 찾는 뉴스(2)를 나란히. 좁으면 위아래로 쌓인다.
     둘 다 세로 목록이다 — 속보를 가로로 나눠 놓으면 옆 순위 목록보다 짧아 아래가 비어 보였다 */
  .dash .toprow{grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:12px; align-items:stretch}
  .toprow .col{flex:3 1 460px; min-width:0}
  .toprow .col.rank{flex:2 1 300px}
  .toprow .col ol{display:flex; flex-direction:column; gap:8px}
  /* 순위 목록: 번호 + 한 줄 제목 + "주제 · 검색량 · 언론사". 빨간색을 쓰지 않는다(속보와 구별) */
  .col.rank ol{display:flex; flex-direction:column; gap:7px}
  .col.rank li{display:grid; grid-template-columns:18px minmax(0,1fr); column-gap:8px; row-gap:1px}
  .col.rank .no{grid-row:1 / 3; font-size:15px; font-weight:800; line-height:1.35; color:var(--c); font-variant-numeric:tabular-nums}
  .col.rank li a{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .col.rank .topic{font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  /* 열어 둔 사이 새로 들어온 속보 표시. 깜빡이지 않는다 */
  .col .new{display:inline-block; margin-right:6px; padding:0 5px; border-radius:4px; background:var(--c); color:#fff; font-size:10.5px; font-weight:800; line-height:1.6; vertical-align:1px}
  .col .more{
    width:100%; margin-top:10px; padding:6px; font-size:12px; color:var(--dim);
    background:transparent; border:1px dashed var(--line);
  }
  .col .more:hover{color:var(--tx); border-color:var(--c)}

  /* ---- 카드 보기 ---- */
  .cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px}
  .card{position:relative; background:var(--card); border:1px solid var(--line); border-radius:13px; padding:15px 17px; overflow:hidden}
  .card::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:var(--c)}
  .card.read{opacity:.5}
  .meta{display:flex; align-items:center; gap:9px; font-size:11.5px; color:var(--dim); margin-bottom:8px; flex-wrap:wrap}
  .meta .cat{color:var(--c); font-weight:700}
  .meta .src{margin-left:auto}
  .card h3{margin:0 0 8px; font-size:16px; line-height:1.42; font-weight:700}
  .card h3 a{color:var(--tx); text-decoration:none}
  .card h3 a:hover{color:var(--accent)}
  .sum{margin:0 0 9px; font-size:13.5px; color:#b9c6d6; line-height:1.65}
  .pts{margin:0 0 9px; padding-left:16px; font-size:12.5px; color:var(--dim)}
  .kw{display:flex; gap:6px; flex-wrap:wrap}
  .kw span{font-size:11.5px; color:var(--dim); background:rgba(255,255,255,.05); border-radius:5px; padding:2px 7px}

  /* ---- 간결 보기 ---- */
  .compact ul{list-style:none; margin:0; padding:0; border:1px solid var(--line); border-radius:12px; overflow:hidden}
  .row{display:flex; align-items:center; gap:12px; padding:9px 14px; border-bottom:1px solid var(--line); font-size:14px}
  .row:last-child{border-bottom:0}
  .row:hover{background:rgba(255,255,255,.03)}
  .row.read{opacity:.45}
  .row time{flex:0 0 62px; font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}
  .row .cat{flex:0 0 84px; font-size:11.5px; font-weight:700; color:var(--c)}
  .row a{flex:1 1 auto; color:var(--tx); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row a:hover{color:var(--accent)}
  .row .src{flex:0 0 auto; font-size:11.5px; color:var(--dim)}

  #btnMore{display:block; width:100%; margin-top:13px; padding:11px; color:var(--dim)}
  #btnMore:hover{color:var(--tx)}
  #empty{border:1px dashed var(--line); border-radius:12px; padding:38px 20px; text-align:center; color:var(--dim); font-size:14px}

  footer{margin-top:24px; padding-top:15px; border-top:1px solid var(--line); color:var(--dim); font-size:12px}

  @media (max-width:560px){
    .row .cat, .row .src{display:none}
    .stats{width:100%; margin-left:0}
    /* 좁은 화면에서는 한 줄 제목이 너무 짧게 잘린다. 순위 목록도 두 줄까지 보인다 */
    .col.rank li a{white-space:normal; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-clamp:2}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1><span class="dot"></span>뉴스알리미</h1>
      <div class="today"><span id="today"></span> <span id="updated" class="upd" hidden></span></div>
    </div>
    <div class="stats">
      <span>표시 <b id="count">0</b>건</span>
      <span>전체 <b id="totalCount">0</b>건</span>
      <span>읽음 <b id="readCount">0</b>건</span>
    </div>
  </header>

  <div id="install-bar" class="install" role="note" hidden>
    <span id="install-text"></span>
    <button type="button" id="install-btn" hidden>앱으로 설치</button>
    <button type="button" id="install-close" aria-label="안내 닫기">닫기</button>
  </div>

  <div id="mockBanner" hidden></div>

  <div class="controls">
    <input type="search" id="q" placeholder="제목·요약·키워드·출처 검색" autocomplete="off">
    <div id="views" role="group" aria-label="보기 방식">
      <button data-view="dashboard" aria-pressed="true">대시보드</button>
      <button data-view="card" aria-pressed="false">카드</button>
      <button data-view="compact" aria-pressed="false">간결</button>
    </div>
    <label class="perCat" id="perCatWrap">칼럼당
      <select id="perCat" aria-label="칼럼당 표시 건수">
        <option value="3">3건</option>
        <option value="4">4건</option>
        <option value="5">5건</option>
        <option value="10">10건</option>
      </select>
    </label>
    <select id="sort" aria-label="정렬 기준">
      <option value="latest">최신순</option>
      <option value="importance">중요도순</option>
    </select>
    <button id="btnUnread" aria-pressed="false">읽지 않은 것만</button>
    <button id="btnReset">읽음 초기화</button>
    <button id="btnRefresh" type="button">새로고침</button>
  </div>

  <div id="chips"></div>

  <div id="list" class="dash"></div>
  <button id="btnMore" hidden></button>
  <div id="empty" hidden></div>

  <!-- 견본이면 견본이라고, 실제 수집물이면 저작권·출처를 app.js 가 적는다 -->
  <footer id="foot"></footer>
</div>

<!-- 목업이 기본값. data/news.js 가 있으면 실제 뉴스로 덮어쓴다.
     fetch 대신 script 태그를 쓰는 이유는 file:// 에서 fetch 가 CORS 에 막히기 때문이다. -->
<script src="data/mock-news.js"></script>
<script src="data/news.js"></script>
<script src="app.js"></script>
</body>
</html>
